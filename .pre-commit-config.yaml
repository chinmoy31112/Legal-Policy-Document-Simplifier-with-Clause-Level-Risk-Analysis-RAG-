repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: make-ci
        name: make ci
        entry: make ci
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
