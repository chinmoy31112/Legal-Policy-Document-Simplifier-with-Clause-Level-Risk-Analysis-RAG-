name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-ci:
    name: Backend Lint, TypeCheck, Migrations, Tests & Eval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: legal_simplifier
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legal_simplifier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy arq redis pre-commit

      - name: Run Ruff Check
        run: ruff check backend

      - name: Run Ruff Format Check
        run: ruff format --check backend

      - name: Run Mypy Type Checker
        run: mypy --config-file backend/pyproject.toml backend/app

      - name: Run Database Migrations on Empty DB
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/legal_simplifier
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          GOOGLE_API_KEY: ""
        run: |
          cd backend
          alembic upgrade head

      - name: Run Backend Tests (Fake LLM)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/legal_simplifier
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          GOOGLE_API_KEY: ""
        run: pytest backend/tests -v

      - name: Run Evaluation Harness
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/legal_simplifier
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          GOOGLE_API_KEY: ""
        run: python -m backend.eval.runner --phase 7 --output /tmp/phase-7-report.md

  frontend-ci:
    name: Frontend Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript TypeCheck
        run: |
          cd frontend
          npx tsc --noEmit
