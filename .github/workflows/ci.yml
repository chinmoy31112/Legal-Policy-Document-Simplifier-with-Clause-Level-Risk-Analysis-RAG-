name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-ci:
    name: Backend Lint, TypeCheck, Tests & Phase Eval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: legal_simplifier
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy arq

      - name: Run Ruff Linter
        run: |
          ruff check backend

      - name: Run Mypy Type Checker
        run: |
          mypy backend/app --ignore-missing-imports

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/legal_simplifier
          APP_ENV: test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/legal_simplifier
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
        run: |
          pytest backend/tests -v

  frontend-ci:
    name: Frontend Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript TypeCheck
        run: |
          cd frontend
          npx tsc --noEmit
